# One line per item: <item folder> <kind> <mods...> [layout:<name>] [keys]
# kind is "mod" or "layout". "keys" merges the item's keys.json into yours
# (existing bindings are never replaced). Mods are resolved from the item folder
# named after them, so a layout can depend on a mod it does not copy.
agent-bar       mod     agent-bar
new-task        mod     new-task keys
branch-cleanup  mod     branch-cleanup keys
tasks           layout  agent-bar layout:tasks
